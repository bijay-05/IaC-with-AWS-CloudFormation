AWSTemplateFormatVersion: 2010-09-09
Description: This template creates a new VPC, subnets, route tables and security groups

Mappings:
  AWSInstanceType2Arch:
    t2.micro:
      Arch: HVM64
    t2.small:
      Arch: HVM64
    t2.medium:
      Arch: HVM64

  AWSRegionArch2AMI:
    ap-south-1:
      HVM64: ami-0c125b398a90e162f

MyEC2Instance:
  Type: AWS::EC2::Instance
  Properties:
    ImageId:
      !FindInMap [
        AWSRegionArch2AMI,
        !Ref "AWS::Region",
        !FindInMap [AWSInstanceType2Arch, !Ref InstanceType, Arch],
      ]
    InstanceType: !Ref InstanceType
    KeyName: !Ref KeyName
    SubnetId: !Ref PublicSubnet
    SecurityGroupIds:
      - !Ref InstanceSecurityGroup
    UserData:
      Fn::Base64: !Sub |
        #!/bin/bash
        yum update -y
        yum install -y httpd
        systemctl start httpd
        systemctl enable httpd
        echo "<h1>Hello from CloudFormation!</h1>" > /var/www/html/index.html
