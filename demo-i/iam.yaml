AWSTemplateFormatVersion: 2010-09-09
Description: This template creates an IAM role, instance profile for SSM access to EC2 instance

Resources:
  SSMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - "sts:AssumeRole"
      Description: Creates an IAM role for the EC2 instance to access SSM
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
      RoleName: SsmRole

  ServerInstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    Properties:
      Path: /
      Roles:
        - !Ref SSMRole

Outputs:
  IamInstanceProfile:
    Description: "IAM Profile for the web server Instance"
    Value: !Ref ServerInstanceProfile
    Export:
      Name: "WebServerIamInstanceProfile"
